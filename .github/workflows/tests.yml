# Pipeline that runs all test codes and then generates docs using GitHub Pages

name: CI Pipeline

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    #container:
    #  image: pytorch/pytorch:2.4.0-cuda12.1-cudnn9-runtime # use pytorch + cuda image
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest pytest-xdist
        python -m pip install numpy
        python -m pip install torch
        python -m pip install matplotlib
        python -m pip install tqdm
        python -m pip install plyfile
        python -m pip install napari[all]
        python -m pip install .
    - name: Test with pytest
      run: |
        pytest ./tests/

  publish-docs:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    needs: test
    env:
      PAGES_BASE: /${{ github.event.repository.name }}
    steps:
    - name: Checkout workflow branch
      uses: actions/checkout@v4
      with:
        path: ci

    - name: Checkout main
      uses: actions/checkout@v4
      with:
        ref: main
        path: src-main

    - name: Checkout dev
      uses: actions/checkout@v4
      with:
        ref: dev
        path: src-dev

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-docs-${{ hashFiles('src-main/setup.py', 'src-main/**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-docs-
          ${{ runner.os }}-pip-

    - name: Install doc build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pdoc3
        python -m pip install numpy torch matplotlib tqdm plyfile
        if [ -f src-main/requirements.txt ]; then pip install -r src-main/requirements.txt; fi

    - name: Build stable documentation (main)
      run: |
        python -m pip install ./src-main
        pdoc --html curlew --output-dir _pdoc_main --force

    - name: Build development documentation (dev)
      run: |
        python -m pip install ./src-dev
        pdoc --html curlew --output-dir _pdoc_dev --force

    - name: Assemble site
      run: |
        mkdir -p _site/dev
        cp -r _pdoc_main/curlew/. _site/
        cp -r _pdoc_dev/curlew/. _site/dev/

    - name: Inject version switcher banner
      run: |
        python ci/.github/scripts/inject_docs_banner.py _site stable
        python ci/.github/scripts/inject_docs_banner.py _site/dev dev

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site

  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    needs: publish-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
